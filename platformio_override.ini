# pio run -e esp32_eth_lc3204
# pio run -e esp32_eth_lc3204 -t upload -v

[env:esp32_eth_lc3208]
extends = env:esp32_eth

custom_usermods =

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags =
  -D DATA_PINS=4

build_flags =
  ${env:esp32_eth.build_flags}
  -D WLED_AP_SSID_UNIQUE
  -D WLED_USE_ETHERNET
  -D ETH_LAN9303
  -D BOARD_LC3208
  -D STATUSLED=1
  -D LAN9303_RST_IO=33
  -D LAN9303_Y1_IO=16
  -D BUFFER_EN_IO=3
  -D LED_PINS=2,4,14,15,32,17,12,5
  -D DEFAULT_LED_PIN=2
  -D DATA_PINS=2 
  -D WLED_DISABLE_ESPNOW
;  -D WLED_DEBUG
  -D CORE_DEBUG_LEVEL=4
  -D LOG_LOCAL_LEVEL=ESP_LOG_DEBUG

lib_deps =
  ${env:esp32_eth.lib_deps}
  symlink://lib/Ethernet_LC3208

lib_ignore =
  Ethernet
  QuickEspNow

[env:esp32_eth_lc3204]
extends = env:esp32_eth

custom_usermods =

build_unflags =
  -D DATA_PINS=4

build_flags = 
  ${env:esp32_eth.build_flags} 
  -D WLED_USE_ETHERNET 
  -D WLED_AP_SSID_UNIQUE 
  -D ETH_LAN8720
  -D BOARD_LC3204
  -D LED_PINS=2,4,14,15
  -D DEFAULT_LED_PIN=2
  -D DATA_PINS=2
  -D STATUSLED=12
  -D WLED_DISABLE_ESPNOW

lib_ignore =
  QuickEspNow

[env:esp32_eth_lc3200dmx]
extends = env:esp32_eth

custom_usermods =

build_unflags =
  -D DATA_PINS=4

build_flags = 
  ${env:esp32_eth.build_flags} ${common.debug_flags} 
  -D WLED_ENABLE_DMX 
  -D WLED_USE_ETHERNET 
  -D ETH_LAN8720
  -D WLED_AP_SSID_UNIQUE 
  -D BOARD_LC3200DMX
  -D WLED_DISABLE_MQTT 
  -D DEFAULT_LED_PIN=1
  -D DATA_PINS=1
  -D STATUSLED=12
  -D WLED_DISABLE_ESPNOW
lib_ignore =
  QuickEspNow

[env:esp32_eth_lc3200ac]
extends = env:esp32_eth

custom_usermods =

build_unflags =
  -D DATA_PINS=4

build_flags = 
  ${env:esp32_eth.build_flags}
  -D WLED_USE_ETHERNET
  -D ETH_LAN8720
  -D WLED_AP_SSID_UNIQUE
  -D WLED_DISABLE_MQTT
  -D BOARD_LC3200AC
  -D STATUSLED=3
  -D DATA_PINS=1
  -D DEFAULT_LED_PIN=1
  -D HWLED_TRIAC_ZCD_IO=33
  -D USERMOD_MULTI_RELAY
  -D WLED_DISABLE_ESPNOW
  -D MULTI_RELAY_MAX_RELAYS=8
  -D MULTI_RELAY_PINS=2,4,12,17,32,5,14,15
  -D MULTI_RELAY_INVERTS=false,false,false,false,false,true,true,true
lib_deps =
  ${env:esp32_eth.lib_deps}
  symlink://usermods/multi_relay
lib_ignore =
  QuickEspNow

[env:esp32_lc3201]
extends = env:esp32dev

custom_usermods =
  ${env:esp32dev.custom_usermods}
  Temperature

build_flags =
  ${env:esp32dev.build_flags}
  -D WLED_AP_SSID_UNIQUE
  -D BOARD_LC3201
  -D STATUSLED=12
  -D DEFAULT_LED_PIN=2
  -D TEMPERATURE_PIN=17
  -D EFUSE_SHDN_PIN=33

lib_deps =
  ${env:esp32dev.lib_deps}
  OneWire@~2.3.7

[env:esp8266_lc800]
extends = env:nodemcuv2

build_flags = ${env:nodemcuv2.build_flags}
  -D WLED_AP_SSID_UNIQUE
  -D BOARD_LC800
  -D DEFAULT_LED_PIN=2
  -D STATUSLED=5
